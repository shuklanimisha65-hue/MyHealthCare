<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – MediCare</title>
  <script>const t=localStorage.getItem('theme')??"dark";document.documentElement.classList.toggle('dark',t==='dark')</script>
  <script type="module" src="/js/pages/profile.js"></script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white">

<div x-data="profileApp">

  <header class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950">
    <div class="flex items-center gap-2">
      <a href="/dashboard.html"
         class="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        ← Dashboard
      </a>
      <a href="/consultation.html"
         class="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 hover:bg-emerald-200 dark:hover:bg-emerald-900/50 transition-colors">
        🤖 Consultation
      </a>
    </div>
    <h1 class="text-sm font-semibold text-gray-600 dark:text-gray-300">My Profile</h1>
    <button @click="logout()"
            class="text-xs text-red-500 dark:text-red-400 hover:text-red-400 border border-red-300 dark:border-red-400/30 rounded-lg px-3 py-1.5 transition-colors">
      Logout
    </button>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-10 space-y-8">


    <div class="flex flex-col items-center gap-4 text-center">
      <div class="w-20 h-20 rounded-full bg-emerald-600 flex items-center justify-center text-3xl font-bold text-white overflow-hidden">
        <template x-if="user?.avatar">
          <img :src="user.avatar" alt="avatar" class="w-full h-full rounded-full object-cover" />
        </template>
        <template x-if="!user?.avatar">
          <span x-text="initials"></span>
        </template>
      </div>
      <div>
        <h1 class="text-2xl font-bold" x-text="user?.fullName || 'User'"></h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm" x-text="user?.email"></p>
      </div>
    </div>

  
    <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 divide-y divide-gray-100 dark:divide-gray-800 shadow-sm">
      <template x-for="field in fields" :key="field.label">
        <div class="flex items-center justify-between px-5 py-4">
          <span class="text-gray-500 dark:text-gray-400 text-sm" x-text="field.label"></span>
          <span class="text-gray-900 dark:text-gray-100 text-sm font-medium" x-text="field.value || '—'"></span>
        </div>
      </template>
    </div>

    <template x-if="user?.allergies?.length > 0">
      <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-5 py-4 shadow-sm">
        <p class="text-gray-500 dark:text-gray-400 text-sm mb-2">Allergies</p>
        <div class="flex flex-wrap gap-2">
          <template x-for="a in user.allergies" :key="a">
            <span x-text="a" class="bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-300 text-xs px-3 py-1 rounded-full"></span>
          </template>
        </div>
      </div>
    </template>

    <template x-if="user?.currentMedications?.length > 0">
      <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-5 py-4 shadow-sm">
        <p class="text-gray-500 dark:text-gray-400 text-sm mb-2">Current Medications</p>
        <div class="flex flex-wrap gap-2">
          <template x-for="m in user.currentMedications" :key="m">
            <span x-text="m" class="bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 text-xs px-3 py-1 rounded-full"></span>
          </template>
        </div>
      </div>
    </template>

    <p class="text-center text-xs text-gray-400 dark:text-gray-600 pb-4">
      Profile information is sourced from your account registration.
    </p>
  </main>

</div>
</body>
</html>
